<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyramid Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>PYRAMID GENERATOR</h3>
        <div class="content">
            <h3>Input</h3>
            <label for="pyramidType">Masukan jenis piramid</label>
            <input type="text" id="pyramidType" placeholder="contoh: *, o">
            <label for="rowCount">Masukan jumlah baris</label>
            <input type="number" id="rowCount" placeholder="contoh: 5">
            <label for="inverted">Posisi piramid</label>
            <select name="Posisi" id="inverted">
                <option value="true">Kebawah</option>
                <option value="false">Keatas</option>
            </select>
        </div>
        <div class="content">
            <h3>Result</h3>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
