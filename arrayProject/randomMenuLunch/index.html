<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Menu Lunch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- soal -->
   <!-- 
        Anda harus membuat sebuah lunches variabel dan menetapkannya array kosong yang akan digunakan untuk menyimpan item makan siang. <br><br>

        Anda harus membuat fungsi addLunchToEnd itu mengambil array sebagai argumen pertama dan string sebagai argumen kedua. <br> Fungsi tersebut harus: <br>

        Tambahkan string ke akhir array.
        Catat stringnya [Lunch Item] added to the end of the lunch menu. ke konsol, di mana [Lunch Item] apakah string diteruskan ke fungsi. <br>
        Kembalikan array yang diperbarui. <br><br>
        Anda harus membuat fungsi addLunchToStart itu mengambil array sebagai argumen pertama dan string sebagai argumen kedua. Fungsi tersebut harus: <br>

        Tambahkan string ke awal array.
        Catat stringnya [Lunch Item] added to the start of the lunch menu. ke konsol, di mana [Lunch Item] apakah string diteruskan ke fungsi. <br>
        Kembalikan array yang diperbarui. <br><br>
        Anda harus membuat fungsi removeLastLunch itu mengambil array sebagai argumennya. Fungsi tersebut harus: <br>

        Hapus elemen terakhir dari array.
        Jika penghapusan berhasil, catat stringnya [Lunch Item] removed from the end of the lunch menu. ke konsol, di mana [Lunch Item] apakah elemen dihapus dari array. <br>
        Jika array kosong, catat stringnya "No lunches to remove." ke konsol. <br>
        Kembalikan array yang diperbarui. <br><br>
        Anda harus membuat fungsi removeFirstLunch itu mengambil array sebagai argumennya. Fungsi tersebut harus: <br>

        Hapus elemen pertama dari array. <br>
        Jika penghapusan berhasil, catat stringnya [Lunch Item] removed from the start of the lunch menu. ke konsol, di mana [Lunch Item] apakah elemen dihapus dari array. <br>
        Jika array kosong, catat stringnya "No lunches to remove." ke konsol. <br>
        Kembalikan array yang diperbarui. <br><br>
        Anda harus membuat fungsi getRandomLunch itu mengambil array sebagai argumennya. Fungsi tersebut harus: <br>

        Pilih elemen acak dari array. <br>
        Jika berhasil, catat stringnya Randomly selected lunch: <br> [Lunch Item] ke konsol, di mana [Lunch Item] adalah elemen acak dalam array. <br>
        Jika array kosong, catat stringnya "No lunches available." ke konsol. <br><br>
        Anda harus membuat fungsi showLunchMenu yang mengambil array sebagai argumennya dan: <br>

        Jika ada elemen dalam array, log string Menu items: <br> [Lunch Item], [Lunch Item]... ke konsol, di mana masing-masing [Lunch item] adalah salah satu elemen dalam array, secara berurutan. <br>
        Jika array kosong, log string "The menu is empty." ke konsol.

     -->
        <div class="container">
            <h3>Tambah Menu </h3>
            <label for="inputMenu">Tambahkan menu: </label>
            <input type="text" id="inputMenu" placeholder="Contoh: Soto">
            <button onclick="tambahMenu()">Tambah</button>
            <button onclick="hapusMenu()">hapus</button>
            <p>hasil: <span id="hasilInputMenu"> </span></p>
        </div>
        <div class="container">
            <h3>Random Menu</h3>
            <button onclick="randomMenu()">Acak Menu</button>
            <p><span id="hasilRandomMenu"></span></p>
        </div>
    <script src="index.js">
       
    </script>
</body>
</html>
