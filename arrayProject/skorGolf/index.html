<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skor Golf</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h3>Skor Golf</h3>
      <input type="text" id="inputName" placeholder="Masukan Nama" />
      <input type="number" id="inputPar" placeholder="Masukan Par" />
      <input type="number" id="inputStrokes" placeholder="Masukan Stroke" />
      <button onclick="hitungSkor()">Cek Skor</button>

      <label for="displayResult">Result:</label>
      <div id="main-card" class="card">
        <p><span id="displayResult"></span></p>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
