<script>
  function stringReverse(str){
  let hasil = ""
  for (let i = str.length -1 ; i >= 0 ; i--) {
    hasil += str[i]
  }
  return hasil
}
console.log(stringReverse("hello"))

function factorial(num){
  let hasil = 1
  for (let i = 1 ; i <= num ; i++) {
    hasil *= i
  }
  return hasil
}
console.log(factorial(5))

function strTerpanjang(str){
  let terpanjang = 0
  let arr = str.split(" ")
  for (let i = 0 ; i < arr.length ; i++ ) {
    if(arr[i].length > terpanjang) {
      terpanjang = arr[i].length
    }
  }
  return terpanjang
}
console.log(strTerpanjang("saya irgi pramudia jr"))

function largestOfFour(arr){
  let hasil = []
  let kotakBesar = arr
  for (let i = 0 ; i < kotakBesar.length ; i++){
    let kotakSekarang = kotakBesar[i]
    let angkaTerbesar = kotakSekarang[0]
    for (let j = 0 ; j < kotakSekarang.length ; j++) {
      if(kotakSekarang[j] > angkaTerbesar){
        angkaTerbesar = kotakSekarang[j]
      }
    }
  hasil.push(angkaTerbesar)
  }
  return hasil
}
console.log(largestOfFour([[4, 5, 1, 3], [13, 27, 18, 26], [32, 35, 37, 39], [1000, 1001, 857, 1]]))

function cariPalingMahal(semuaKantong){
  let catatan = []
  for (let i = 0 ; i < semuaKantong.length ; i++) {
    let kantongIni = semuaKantong[i]
    let skorTertinggi = kantongIni[0]

    for (let j = 0 ; j < kantongIni.length ; j++){
      if (kantongIni[j] > skorTertinggi){
        skorTertinggi = kantongIni[j]
      }
    }
    catatan.push(skorTertinggi)
  }
  return catatan
}
console.log(cariPalingMahal([ [10, 50], [20, 5], [100, 30] ]))

</script>
